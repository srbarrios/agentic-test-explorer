missions:
- thread_id: pr_11830_listing_01
  prompt: 'Navigate to https://uyuni-ci-main-podman-server.mgr.suse.de and find any
    data table that uses the Table component with search functionality (e.g., Systems
    list, Patches list, or similar listing pages). Verify that the search/filter bar
    is functional: type a search term and confirm results update correctly. Check
    that pagination controls appear at the bottom of the table and display correct
    page info (current page, total items, items per page). Verify that the table header
    renders correctly with column headers visible. Confirm that switching pages via
    pagination works and the data updates accordingly. Look for any visual regressions
    in table layout — column alignment, header styling, row spacing.

    '
- thread_id: pr_11830_listing_02
  prompt: 'Navigate to https://uyuni-ci-main-podman-server.mgr.suse.de and locate
    a table that supports bulk action buttons in the header (titleButtons pattern),
    such as the Systems list or any list with Add/Delete actions in the top-right
    area. Verify that action buttons (e.g., "Add", "Delete") appear in the table header
    area (top-right or top section). Test clicking the Add button and confirm the
    expected dialog or form opens. Test clicking the Delete button with no rows selected
    and verify appropriate feedback (error message, disabled state, or confirmation
    prompt). Confirm the table header layout is not broken when action buttons are
    present alongside the search bar. Check that an empty table state (no data) renders
    correctly with the action buttons still visible and functional.

    '
- thread_id: pr_11830_listing_03
  prompt: 'Navigate to https://uyuni-ci-main-podman-server.mgr.suse.de and find a
    table that uses inline search panel with additional filters (searchPanelInline
    pattern), such as any list page that has checkboxes or filter toggles alongside
    the search bar. Verify that when searchPanelInline is active, the search input
    and additional filter controls (checkboxes like API, Web, Only selected) appear
    on the same row rather than stacked. Toggle each checkbox filter and confirm the
    table data updates or filters accordingly. Verify that the search bar and inline
    filters do not overlap or break the layout at different viewport widths. Confirm
    that combining a text search with checkbox filters produces correctly filtered
    results. Check that unchecking all filters restores the full unfiltered dataset.

    '
- thread_id: pr_11830_listing_04
  prompt: 'Navigate to https://uyuni-ci-main-podman-server.mgr.suse.de and open any
    table-based listing page (e.g., Systems > System List, or Software > Patches).
    Specifically test the empty table state: if possible, apply a search term that
    returns zero results and verify the empty state message is displayed correctly
    without layout breakage. Verify that pagination controls are hidden or appropriately
    disabled when the table has no data. Confirm that action buttons (if present in
    the header) remain accessible and correctly positioned even when the table body
    is empty. Check that the column headers still render correctly with no data rows
    present.

    '
- thread_id: pr_11830_form_01
  prompt: 'Navigate to https://uyuni-ci-main-podman-server.mgr.suse.de and locate
    any page that uses DEPRECATED_Check (checkbox) components within a table filter
    panel, such as filter panels in listing pages. Verify that checkbox inputs render
    correctly with their labels (e.g., "API", "Web", "Only selected" style labels).
    Click each checkbox and verify the checked/unchecked state toggles visually and
    functionally. Confirm that checkbox state is preserved when interacting with the
    search bar simultaneously. Verify that the checkbox group layout (d-flex, me-4
    spacing) does not break at narrow viewport widths. Check that form accessibility
    is maintained — labels are associated with their inputs and keyboard navigation
    works.

    '
- thread_id: pr_11830_explorer_autonomous_01
  prompt: Perform a broad regression sweep on https://uyuni-ci-main-podman-server.mgr.suse.de
    focusing on all table-based listing pages throughout
