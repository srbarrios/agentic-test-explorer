missions:
- thread_id: pr_11902_form_01
  prompt: 'Navigate to the ''Systems'' > ''System Details'' page for a client configured
    as an Ansible Control Node.  Verify that the software installation state remains
    consistent.  Trigger a state refresh or highstate application to ensure the new
    logic correctly identifies  the presence of either ''ansible-core'' or ''ansible''
    without triggering unnecessary re-installations.

    '
- thread_id: pr_11902_listing_01
  prompt: 'Navigate to the ''Systems'' > ''System List'' page. Select a system that
    has the ''ansible_control_node''  addon group type. Verify that the system details
    page loads correctly and that the ''Software'' >  ''Packages'' > ''Installed''
    list correctly reflects the installed Ansible package (either ansible or ansible-core).

    '
- thread_id: pr_11902_explorer_01
  prompt: 'Perform an autonomous regression sweep on the ''Systems'' management module.  Focus
    on the Ansible Control Node configuration flow.  Attempt to apply configurations
    to systems with varying package availability (systems with  ansible-core vs systems
    with legacy ansible).  Verify that the Salt state application does not fail due
    to package dependency conflicts  introduced by the new conditional logic in init.sls.

    '
- thread_id: pr_11902_explorer_02
  prompt: 'Conduct a cross-feature integration test: Navigate to ''Configuration''
    > ''Channels'' and  ''Systems'' > ''Software''. Ensure that the package management
    UI correctly handles the  new preference for ''ansible-core''. Verify that no
    UI errors occur when the system  reports ''ansible-core'' as the primary provider
    for Ansible functionality.'
