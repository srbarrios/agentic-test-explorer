[project]
name = "agentic-test-explorer"
version = "0.2.0"
description = "Product-agnostic agentic exploratory QA framework for web applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Oscar Barrios Torrero", email = "srbarrios@gmail.com" },
]
maintainers = [
    { name = "Oscar Barrios Torrero", email = "srbarrios@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "langchain>=1.5.2,<1.6",
    "langchain-google-genai~=4.2.1",
    "langchain-google-vertexai~=3.2.1",
    "langchain-anthropic>=1.4.3,<1.6.0",
    "langchain-community~=0.4.1",
    "langchain-core>=1.8,<2",
    "langgraph>=1.2.5,<1.3,!=1.2.3",  # 1.2.3 was yanked (merge-strategy regression)
    "playwright~=1.58.0",
    "python-dotenv~=1.2.2",
    "pyyaml~=6.0.1",
    "pillow>=12.2,<13.1",
    "langchain-mcp-adapters~=0.2.2",
    "langgraph-checkpoint-sqlite>=3.1.3,<3.2",
    "aiosqlite~=0.22.1",
    "httpx~=0.28.1",
    "langmem~=0.0.30",
    # mcp 2.x breaks langchain-mcp-adapters 0.2.x (RequestContext import).
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
visual = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_explorer"]

[tool.uv]
package = true

[project.urls]
Homepage = "https://oscarbarrios.tech"
Repository = "https://github.com/srbarrios/agentic-test-explorer"
"Source Code" = "https://github.com/srbarrios/agentic-test-explorer"
Issues = "https://github.com/srbarrios/agentic-test-explorer/issues"

[project.scripts]
agent-explorer = "agentic_explorer.main:main"
agent-auth = "agentic_explorer.auth_setup:main"
